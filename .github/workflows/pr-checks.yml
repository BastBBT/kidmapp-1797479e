name: PR checks

# Barrière mécanique avant merge dans main (branche suivie par Lovable).
# Le jugement — sécurité fine, dette, legacy — est fait par l'agent local `/check-pr`.
#
# ATTENTION : ce workflow exécute les scripts de garde VENANT DE LA PR. Une PR peut donc
# neutraliser la barrière en éditant `scripts/` ou `.github/`. Protéger ces deux chemins
# par CODEOWNERS + branch protection, sinon la barrière n'est que déclarative.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  securite:
    name: Sécurité (secrets, RLS, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — les gardes comparent la PR à sa base. Sans l'historique complet,
      # la garde échoue volontairement (fail-closed) au lieu de rendre un vert non fondé.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Aucune dépendance à installer : la garde n'utilise que git et la stdlib Node.
      - name: Garde sécurité
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/security-guard.mjs --base "origin/${BASE_REF}"

  qualite:
    name: Types, tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # bun.lock est le lockfile de référence (Lovable installe avec bun).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # Mesure la dette eslint à la merge-base et n'échoue que si elle augmente.
      # Nécessite l'historique complet et node_modules (réutilisé pour le worktree de base).
      - name: Ratchet eslint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/eslint-ratchet.mjs --base "origin/${BASE_REF}"

      - name: Build de production
        run: npx vite build
